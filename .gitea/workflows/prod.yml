name: Build and publish the Waypoints Gateway image

# Builds ghcr.io/j5guy/waypoints-gateway (multi-arch) on every push to master and creates a Gitea release for the
# version in package.json. Runs on the same runner as the other apps. Needs, in this repository's
# Settings > Actions > Secrets: GHCR_USER and GHCR_TOKEN (a PAT with write:packages) and DOCKER_GITEA_TOKEN.
# The GHCR package must be public so the compose file can pull it without signing in.
#
# It also publishes the repository to GitHub (j5guy/waypoints-gateway), following PUBLISHING_RUNBOOK.md: the publish
# gate (commit identity, secrets, private denylist, file types) runs first and stops everything if it fails, the push
# is fast-forward only and sends only master and tags, and afterwards a fresh clone of GitHub is checked again.
# Extra secrets: REMOTE_REPO_TOKEN (a GitHub fine-grained token for this one repository: Contents and Releases write;
# note a secret name cannot start with GITHUB_) and PUBLISH_DENYLIST (the private list of strings that must never
# go public, one regular expression per line). The runner needs gitleaks installed (/usr/local/bin/gitleaks).
#
# Also needs these repository variables (Settings > Actions > Variables), so no server address is written in this file:
# LOCAL_GITEA_HOST (your Gitea's address) and LOCAL_GITEA_REPO (the repository as owner/name, for example
# allthewaypoints/gateway). Gitea reserves variable names that start with GITEA_, which is why these start with LOCAL_.

env:
  BUILD_NAME: waypoints-gateway
  BUILD_DIR: /var/www/html/waypoints-gateway
  GITEA_HOST: ${{ vars.LOCAL_GITEA_HOST }}
  GITEA_REPO: ${{ vars.LOCAL_GITEA_REPO }}
  REPO_URL: git@${{ vars.LOCAL_GITEA_HOST }}:/${{ vars.LOCAL_GITEA_REPO }}.git
  IMAGE: ghcr.io/j5guy/waypoints-gateway
  GITHUB_REPO: github.com/j5guy/waypoints-gateway.git

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/site/**'
      - 'docs-admin/**'
      - '.gitea/workflows/docs.yml'

jobs:
  build-image:
    runs-on: web-prod
    steps:
      - name: Check the repository variables
        run: |
          if [ -z "${{ vars.LOCAL_GITEA_HOST }}" ] || [ -z "${{ vars.LOCAL_GITEA_REPO }}" ]; then
            echo "Set the repository variables LOCAL_GITEA_HOST (your Gitea's address) and LOCAL_GITEA_REPO (owner/name) in Settings > Actions > Variables." >&2
            exit 1
          fi

      - name: Clone or Pull Latest Code
        run: |
          if [ -d "${{ env.BUILD_DIR }}/.git" ]; then
            # Match Gitea exactly, even after a force-push: no leftover branches, remote refs or old objects, because
            # the publish gate checks every ref in this folder.
            cd "${{ env.BUILD_DIR }}"
            git fetch --prune --force origin '+refs/heads/*:refs/remotes/origin/*'
            git checkout -f -B master origin/master
            git reset --hard origin/master
            git clean -fdx -e node_modules
            for b in $(git for-each-ref --format='%(refname:short)' refs/heads | grep -v '^master$'); do git branch -D "$b"; done
            for t in $(git tag); do git tag -d "$t" >/dev/null; done
            git fetch --tags --force origin
            git reflog expire --expire=now --all
            git gc --prune=now --quiet
          else
            mkdir -p "${{ env.BUILD_DIR }}"
            git clone "${{ env.REPO_URL }}" "${{ env.BUILD_DIR }}"
          fi

      # The gateway has no npm dependencies and no test suite yet, so this catches a typo or an incomplete
      # catalog entry before an image is built and pushed under :latest.
      # Before anything is built or pushed: nothing that must not go public may be in the tree or the history.
      - name: Publish gate (commit identity, secrets, denylist, file types)
        env:
          PUBLISH_DENYLIST: ${{ secrets.PUBLISH_DENYLIST }}
        run: |
          deny="$(mktemp)"
          trap 'rm -f "$deny"' EXIT
          chmod 600 "$deny"
          printf '%s\n' "$PUBLISH_DENYLIST" > "$deny"
          PUBLISH_DENYLIST_FILE="$deny" bash scripts/publish-gate.sh
        working-directory: ${{ env.BUILD_DIR }}

      - name: Syntax and catalog checks
        run: bash scripts/check.sh
        working-directory: ${{ env.BUILD_DIR }}

      - name: Read Version from package.json
        run: |
          VERSION=$(grep '"version"' package.json | head -1 | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        working-directory: ${{ env.BUILD_DIR }}

      - name: Create Gitea Release
        run: |
          TAG="v${{ env.VERSION }}"
          STATUS=$(curl -sk -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.DOCKER_GITEA_TOKEN }}" \
            "https://${{ vars.LOCAL_GITEA_HOST }}/api/v1/repos/${{ vars.LOCAL_GITEA_REPO }}/releases/tags/$TAG")
          echo "Checking for an existing release $TAG in ${{ vars.LOCAL_GITEA_REPO }}: HTTP $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "Gitea release $TAG already exists, skipping (bump the version in package.json to publish a new one)."
          else
            CODE=$(curl -sk -o /tmp/release-reply.txt -w "%{http_code}" -X POST \
              -H "Authorization: token ${{ secrets.DOCKER_GITEA_TOKEN }}" \
              -H "Content-Type: application/json" \
              "https://${{ vars.LOCAL_GITEA_HOST }}/api/v1/repos/${{ vars.LOCAL_GITEA_REPO }}/releases" \
              -d "{\"tag_name\":\"$TAG\",\"target_commitish\":\"master\",\"name\":\"$TAG\"}")
            if [ "$CODE" != "201" ]; then
              echo "Gitea answered HTTP $CODE when creating release $TAG:"
              cat /tmp/release-reply.txt; echo
              echo "000: the host could not be reached. 401/403: DOCKER_GITEA_TOKEN is missing, expired or lacks write:repository. 404: check LOCAL_GITEA_HOST and LOCAL_GITEA_REPO. 409/422: the tag or release already exists."
              exit 1
            fi
          fi

      # Multi-arch (amd64 + arm64) so it runs on a Raspberry Pi 4/5 (64-bit OS).
      - name: Set up QEMU (for cross-building the arm64 layer on this runner)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin

      - name: Build and push multi-arch image to GHCR
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t "${{ env.IMAGE }}:latest" \
            -t "${{ env.IMAGE }}:${{ env.VERSION }}" \
            --push \
            .
        working-directory: ${{ env.BUILD_DIR }}

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io || true

      # Only master and tags leave, with no --force: if the histories ever differ the push fails instead of overwriting.
      - name: Push to GitHub (fast-forward only, master and tags only)
        run: |
          git push "https://x-access-token:${{ secrets.REMOTE_REPO_TOKEN }}@${{ env.GITHUB_REPO }}" HEAD:refs/heads/master
          git push "https://x-access-token:${{ secrets.REMOTE_REPO_TOKEN }}@${{ env.GITHUB_REPO }}" --tags
        working-directory: ${{ env.BUILD_DIR }}

      # Clone what GitHub now holds and run the gate on that. If it fails, make the repository private straight away
      # (GitHub > Settings > Danger zone) and fix it. The clone uses the token so this also works while it is private.
      - name: Verify what GitHub actually holds
        env:
          PUBLISH_DENYLIST: ${{ secrets.PUBLISH_DENYLIST }}
        run: |
          deny="$(mktemp)"; check="$(mktemp -d)"
          trap 'rm -rf "$deny" "$check"' EXIT
          chmod 600 "$deny"
          printf '%s\n' "$PUBLISH_DENYLIST" > "$deny"
          git clone "https://x-access-token:${{ secrets.REMOTE_REPO_TOKEN }}@${{ env.GITHUB_REPO }}" "$check/repo"
          cp .gitleaks.toml scripts/publish-gate.sh "$check/repo/"
          mkdir -p "$check/repo/.githooks" && cp .githooks/blocked-paths.regex "$check/repo/.githooks/"
          cd "$check/repo"
          PUBLISH_DENYLIST_FILE="$deny" bash publish-gate.sh
        working-directory: ${{ env.BUILD_DIR }}

      - name: Create GitHub Release
        run: |
          TAG="v${{ env.VERSION }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.REMOTE_REPO_TOKEN }}" \
            "https://api.github.com/repos/j5guy/waypoints-gateway/releases/tags/$TAG")
          if [ "$STATUS" = "200" ]; then
            echo "GitHub release $TAG already exists, skipping (bump the version in package.json to publish a new one)."
          else
            curl -sf -X POST \
              -H "Authorization: Bearer ${{ secrets.REMOTE_REPO_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/j5guy/waypoints-gateway/releases" \
              -d "{\"tag_name\":\"$TAG\",\"target_commitish\":\"master\",\"name\":\"$TAG\",\"generate_release_notes\":true}"
          fi
