<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Charging Waypoints icon</title>
  <desc>A near-black rounded square containing a clock face at the center, with dotted waypoint trails radiating out to markers in the suite's accent colors, and one larger gold destination marker at the top.</desc>

  <rect x="0" y="0" width="512" height="512" rx="100" fill="#14171A"/>

  <!-- radiating dotted trails -->
  <g stroke="#F7F5F1" stroke-width="3" stroke-linecap="round" stroke-dasharray="1,14" opacity="0.65">
    <line x1="256" y1="176" x2="256" y2="106"/>
    <line x1="311.1" y1="200.9" x2="362.1" y2="149.9"/>
    <line x1="336" y1="256" x2="406" y2="256"/>
    <line x1="311.1" y1="311.1" x2="362.1" y2="362.1"/>
    <line x1="256" y1="336" x2="256" y2="406"/>
    <line x1="200.9" y1="311.1" x2="149.9" y2="362.1"/>
    <line x1="176" y1="256" x2="106" y2="256"/>
    <line x1="200.9" y1="200.9" x2="149.9" y2="149.9"/>
  </g>

  <!-- clock face -->
  <circle cx="256" cy="256" r="80" fill="#F7F5F1"/>
  <circle cx="256" cy="256" r="80" fill="none" stroke="#D97706" stroke-width="8"/>
  <g stroke="#22282A" stroke-width="4" stroke-linecap="round">
    <line x1="256" y1="188" x2="256" y2="200"/>
    <line x1="256" y1="312" x2="256" y2="324"/>
    <line x1="188" y1="256" x2="200" y2="256"/>
    <line x1="312" y1="256" x2="324" y2="256"/>
  </g>
  <line x1="256" y1="256" x2="256" y2="212" stroke="#22282A" stroke-width="7" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="288" y2="256" stroke="#22282A" stroke-width="7" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="8" fill="#22282A"/>

  <!-- waypoint markers, each a different suite accent color -->
  <circle cx="362.1" cy="149.9" r="10" fill="#1D4ED8"/>
  <circle cx="406" cy="256" r="10" fill="#0D9488"/>
  <circle cx="362.1" cy="362.1" r="10" fill="#7C3AED"/>
  <circle cx="256" cy="406" r="10" fill="#15803D"/>
  <circle cx="149.9" cy="362.1" r="10" fill="#0D9488"/>
  <circle cx="106" cy="256" r="10" fill="#1D4ED8"/>
  <circle cx="149.9" cy="149.9" r="10" fill="#15803D"/>

  <!-- destination marker -->
  <circle cx="256" cy="106" r="18" fill="#F2C879"/>
  <circle cx="256" cy="106" r="26" fill="none" stroke="#F2C879" stroke-width="2"/>
</svg>
