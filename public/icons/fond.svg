<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Fond Waypoints icon</title>
  <desc>A near-black rounded square containing a cream daisy at the center, with dotted waypoint trails radiating out from each petal tip to markers in the suite's accent colors, and one larger gold destination marker at the top.</desc>

  <rect x="0" y="0" width="512" height="512" rx="100" fill="#14171A"/>

  <!-- radiating dotted trails, one per petal -->
  <g stroke="#FBEFE0" stroke-width="3" stroke-linecap="round" stroke-dasharray="1,14" opacity="0.65">
    <line x1="256" y1="166" x2="256" y2="106"/>
    <line x1="317.9" y1="194.1" x2="362.1" y2="149.9"/>
    <line x1="346" y1="256" x2="406" y2="256"/>
    <line x1="317.9" y1="317.9" x2="362.1" y2="362.1"/>
    <line x1="256" y1="346" x2="256" y2="406"/>
    <line x1="194.1" y1="317.9" x2="149.9" y2="362.1"/>
    <line x1="166" y1="256" x2="106" y2="256"/>
    <line x1="194.1" y1="194.1" x2="149.9" y2="149.9"/>
  </g>

  <!-- daisy petals -->
  <g transform="translate(256,256)">
    <g fill="#FBEFE0">
      <ellipse cx="0" cy="-62" rx="16" ry="34"/>
      <ellipse cx="0" cy="-62" rx="16" ry="34" transform="rotate(45)"/>
      <ellipse cx="0" cy="-62" rx="16" ry="34" transform="rotate(90)"/>
      <ellipse cx="0" cy="-62" rx="16" ry="34" transform="rotate(135)"/>
      <ellipse cx="0" cy="-62" rx="16" ry="34" transform="rotate(180)"/>
      <ellipse cx="0" cy="-62" rx="16" ry="34" transform="rotate(225)"/>
      <ellipse cx="0" cy="-62" rx="16" ry="34" transform="rotate(270)"/>
      <ellipse cx="0" cy="-62" rx="16" ry="34" transform="rotate(315)"/>
    </g>
    <circle cx="0" cy="0" r="32" fill="#F2C879"/>
  </g>

  <!-- waypoint markers at trail ends, each a different suite accent color -->
  <circle cx="362.1" cy="149.9" r="10" fill="#1D4ED8"/>
  <circle cx="406" cy="256" r="10" fill="#0D9488"/>
  <circle cx="362.1" cy="362.1" r="10" fill="#D97706"/>
  <circle cx="256" cy="406" r="10" fill="#7C3AED"/>
  <circle cx="149.9" cy="362.1" r="10" fill="#15803D"/>
  <circle cx="106" cy="256" r="10" fill="#1D4ED8"/>
  <circle cx="149.9" cy="149.9" r="10" fill="#0D9488"/>

  <!-- destination marker -->
  <circle cx="256" cy="106" r="18" fill="#F2C879"/>
  <circle cx="256" cy="106" r="26" fill="none" stroke="#F2C879" stroke-width="2"/>
</svg>
